<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Administrativo — BellaMix</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--pink:#d9467a;--dark:#17131a;--muted:#6b6570;--bg:#f7f4f7;--card:#fff;--line:#ece6ed;--green:#15803d;--red:#b91c1c}
body{margin:0;background:var(--bg);color:var(--dark);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.admin{max-width:1180px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:25px;font-weight:800}.brand span{color:var(--pink)}.sub{color:var(--muted);font-size:13px}.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 4px 18px rgba(30,10,30,.04)}.login{max-width:420px;margin:80px auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{font-size:27px;display:block;margin-top:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.tabs button,.btn,.smallbtn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#eee7ed;color:var(--dark);font-weight:650}.tabs button.active,.btn{background:var(--pink);color:#fff}.btn.danger,.danger{background:#fee2e2;color:#991b1b}.smallbtn{padding:7px 9px;font-size:12px}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ddd5df;border-radius:9px;margin:5px 0 10px;background:#fff}textarea{min-height:70px;resize:vertical}.formgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.formgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:12px;text-transform:uppercase;color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eee;color:#555}.paid,.delivered{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.cancelled{background:#fee2e2;color:#991b1b}.processing,.shipped{background:#e0e7ff;color:#3730a3}.muted{color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none!important}.searchbar{display:grid;grid-template-columns:2fr 1fr auto;gap:8px}.order{border:1px solid var(--line);border-radius:13px;padding:15px;margin:10px 0}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:10px 0}.footer{font-size:12px;color:var(--muted);margin-top:25px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.formgrid2,.searchbar{grid-template-columns:1fr}.admin{padding:14px}}
</style>
</head>
<body>
<div class="admin">
  <div id="login" class="box login">
    <div class="brand">Bella<span>Mix</span></div><p class="sub">Painel administrativo seguro</p>
    <input id="le" type="email" placeholder="E-mail do administrador" autocomplete="username">
    <input id="lp" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="btn" style="width:100%" onclick="login()">Entrar no painel</button>
    <p id="loginError" class="sub"></p>
  </div>
  <div id="app" class="hidden">
    <div class="top"><div><div class="brand">Bella<span>Mix</span> — Administração</div><div class="sub">Produtos, estoque e pedidos em um só lugar.</div></div><button class="smallbtn" onclick="logout()">Sair</button></div>
    <div id="stats" class="grid"></div>
    <div class="tabs"><button id="tDashboard" onclick="showDashboard()">Visão geral</button><button id="tProducts" onclick="showProducts()">Produtos</button><button id="tOrders" onclick="showOrders()">Pedidos</button></div>
    <div id="content"></div>
    <div class="footer">BellaMix Cosméticos · Painel administrativo</div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
async function api(u,o){const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Erro');return d}
function money(c){return (Number(c)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function boot(){try{const d=await api('/api/admin/me');if(d.admin){$('login').classList.add('hidden');$('app').classList.remove('hidden');await refreshStats();showDashboard()}}catch{}}
async function refreshStats(){const s=await api('/api/admin/stats');$('stats').innerHTML=`<div class="stat"><span class="muted">Faturamento</span><b>${money(s.orders.revenue_cents)}</b></div><div class="stat"><span class="muted">Pedidos</span><b>${s.orders.count}</b></div><div class="stat"><span class="muted">Pedidos em andamento</span><b>${s.pending.count}</b></div><div class="stat"><span class="muted">Estoque baixo</span><b>${s.products.low_stock}</b></div>`}
function activeTab(id){['tDashboard','tProducts','tOrders'].forEach(x=>$(x).classList.remove('active'));$(id).classList.add('active')}
async function login(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('le').value.trim(),password:$('lp').value})});location.reload()}catch(e){$('loginError').textContent=e.message}}
async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}
async function showDashboard(){activeTab('tDashboard');await refreshStats();const ps=await api('/api/admin/products');const low=ps.filter(p=>p.active&&p.stock<=5);$('content').innerHTML=`<div class="box"><h2>Resumo da operação</h2><p class="muted">Use o painel para cadastrar produtos, ajustar preços/estoque e acompanhar cada pedido.</p>${low.length?`<div class="notice"><b>Atenção:</b> ${low.length} produto(s) com estoque igual ou inferior a 5 unidades.</div>`:'<p>✓ Nenhum alerta de estoque baixo.</p>'}</div>`}
function productForm(p={}){return `<input id="pn" placeholder="Nome do produto" value="${esc(p.name||'')}"><textarea id="pd" placeholder="Descrição">${esc(p.description||'')}</textarea><div class="formgrid"><input id="pp" type="number" step="0.01" min="0" placeholder="Preço (R$)" value="${p.id?(p.price_cents/100).toFixed(2):''}"><input id="ps" type="number" min="0" placeholder="Estoque" value="${p.stock??''}"><input id="pc" placeholder="Categoria" value="${esc(p.category||'maquiagem')}"></div><input id="pi" placeholder="URL da imagem (opcional)" value="${esc(p.image_url||'')}"><label><input id="pa" type="checkbox" style="width:auto;margin-right:6px" ${p.id?(p.active?'checked':''):'checked'}> Produto ativo na loja</label>`}
async function showProducts(){activeTab('tProducts');const ps=await api('/api/admin/products');$('content').innerHTML=`<div class="box"><h2 id="formTitle">Cadastrar produto</h2><div id="productForm">${productForm()}</div><div class="actions"><button class="btn" onclick="saveProduct()">Salvar produto</button><button id="cancelEdit" class="smallbtn hidden" onclick="showProducts()">Cancelar edição</button></div></div><div class="box"><h2>Catálogo</h2><div class="searchbar"><input id="productSearch" placeholder="Buscar produto..." oninput="filterProducts()"><select id="stockFilter" onchange="filterProducts()"><option value="all">Todos</option><option value="low">Estoque baixo</option><option value="inactive">Inativos</option></select><button class="smallbtn" onclick="showProducts()">Atualizar</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead><tbody id="productRows"></tbody></table></div></div>`;window.adminProducts=ps;renderProducts(ps)}
function renderProducts(ps){$('productRows').innerHTML=ps.map(p=>`<tr data-search="${esc((p.name+' '+p.category).toLowerCase())}" data-stock="${p.stock}" data-active="${p.active}"><td><b>${esc(p.name)}</b><br><span class="muted">#${p.id}</span></td><td>${esc(p.category)}</td><td>${money(p.price_cents)}</td><td>${p.stock}</td><td><span class="badge ${p.active?'paid':'cancelled'}">${p.active?'Ativo':'Inativo'}</span></td><td><div class="actions"><button class="smallbtn" onclick='editProduct(${p.id})'>Editar</button><button class="smallbtn danger" onclick='deactivateProduct(${p.id})'>Desativar</button></div></td></tr>`).join('')||'<tr><td colspan="6">Nenhum produto.</td></tr>'}
function filterProducts(){const q=($('productSearch').value||'').toLowerCase();const f=$('stockFilter').value;document.querySelectorAll('#productRows tr').forEach(r=>{const text=r.dataset.search||'';const stock=Number(r.dataset.stock||0);const active=Number(r.dataset.active);let ok=text.includes(q);if(f==='low')ok=ok&&active===1&&stock<=5;if(f==='inactive')ok=ok&&active===0;r.style.display=ok?'':'none'})}
function editProduct(id){const p=window.adminProducts.find(x=>x.id===id);if(!p)return;$('formTitle').textContent='Editar produto #'+id;$('productForm').innerHTML=productForm(p);$('cancelEdit').classList.remove('hidden');$('cancelEdit').dataset.id=id;window.editingId=id;window.scrollTo({top:0,behavior:'smooth'})}
async function saveProduct(){const data={name:$('pn').value.trim(),description:$('pd').value.trim(),price:$('pp').value,stock:$('ps').value,category:$('pc').value.trim()||'maquiagem',image_url:$('pi').value.trim(),active:$('pa').checked};if(!data.name||Number(data.price)<0)return alert('Informe nome e preço válidos.');const id=window.editingId;await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});window.editingId=null;await showProducts();await refreshStats()}
async function deactivateProduct(id){if(!confirm('Desativar este produto da loja?'))return;await api('/api/admin/products/'+id,{method:'DELETE'});await showProducts();await refreshStats()}
function statusLabel(s){return {pending:'Pendente',paid:'Pago',processing:'Separando',shipped:'Enviado',delivered:'Entregue',cancelled:'Cancelado'}[s]||s}
async function showOrders(){activeTab('tOrders');const os=await api('/api/admin/orders');$('content').innerHTML=`<div class="box"><div class="orderhead"><h2>Pedidos</h2><button class="smallbtn" onclick="showOrders()">Atualizar</button></div><div class="searchbar"><input id="orderSearch" placeholder="Buscar por cliente, e-mail ou número" oninput="filterOrders()"><select id="orderFilter" onchange="filterOrders()"><option value="all">Todos os status</option>${['pending','paid','processing','shipped','delivered','cancelled'].map(s=>`<option value="${s}">${statusLabel(s)}</option>`).join('')}</select><span></span></div><div id="orderList"></div></div>`;window.adminOrders=os;renderOrders(os)}
function renderOrders(os){$('orderList').innerHTML=os.map(o=>`<div class="order" data-search="${esc((o.customer_name+' '+o.email+' '+o.id).toLowerCase())}" data-status="${o.status}"><div class="orderhead"><div><b>Pedido #${o.id}</b><br><span class="muted">${esc(o.customer_name)} · ${esc(o.email)}</span><br><span class="muted">${esc(o.phone||'')} ${o.city?'· '+esc(o.city):''}</span></div><div><span class="badge ${o.status}">${statusLabel(o.status)}</span><br><b>${money(o.total_cents)}</b></div></div><p>${o.items.map(x=>`${x.quantity}× ${esc(x.product_name)} — ${money(x.unit_price_cents*x.quantity)}`).join('<br>')}</p><div class="formgrid2"><select onchange="status(${o.id},this.value)">${['pending','paid','processing','shipped','delivered','cancelled'].map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${statusLabel(s)}</option>`).join('')}</select><input value="${esc(o.address||'')}${o.cep?' · CEP '+esc(o.cep):''}" readonly></div></div>`).join('')||'<p>Nenhum pedido encontrado.</p>'}
function filterOrders(){const q=($('orderSearch').value||'').toLowerCase(),f=$('orderFilter').value;document.querySelectorAll('.order').forEach(r=>r.style.display=((r.dataset.search||'').includes(q)&&(f==='all'||r.dataset.status===f))?'':'none')}
async function status(id,s){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});await refreshStats();await showOrders()}
boot();
</script>
</body></html>
