<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido - BellaMix</title><link rel="stylesheet" href="/public/style.css"></head><body><main style="max-width:800px;margin:60px auto;padding:20px"><h1>BellaMix Cosméticos</h1><div id="box">Carregando pedido...</div></main><script>
const id=new URLSearchParams(location.search).get('order');const money=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function run(){const r=await fetch('/api/orders/'+id);const o=await r.json();if(!r.ok){box.innerHTML='<h2>Pedido não encontrado.</h2>';return}box.innerHTML=`<div class="card"><h2>Pedido #${o.id}</h2><p><b>Status:</b> ${o.status}</p>${o.items.map(x=>`<p>${x.quantity} × ${x.product_name} — ${money(x.unit_price_cents)}</p>`).join('')}<hr><h2>Total ${money(o.total_cents)}</h2><p>Obrigado pela sua compra!</p><a class="btn" href="/">Voltar à loja</a></div>`}run();
</script></body></html>
